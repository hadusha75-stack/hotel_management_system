<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Us — SABAWYAN HOTEL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/pages/feedback.css">
</head>
<body>

  <a href="../../index.html">
    <img src="../../photo/exit.png" alt="Back to Home" class="exit">
  </a>

  <div class="feedback-container">

    <div class="feedback-header">
      <div class="icon-wrap"><i class="fas fa-star"></i></div>
      <h2>Rate Our Services</h2>
      <div class="gold-divider"></div>
    </div>

    <p>We'd love to hear your opinion! Rate your experience below.</p>

    <div class="stars">
      <i class="fas fa-star"></i>
      <i class="fas fa-star"></i>
      <i class="fas fa-star"></i>
      <i class="fas fa-star"></i>
      <i class="fas fa-star"></i>
    </div>

    <textarea placeholder="Tell us about your experience..."></textarea>
    <button type="submit"><i class="fas fa-paper-plane"></i> &nbsp;Submit Rating</button>

  </div>

<script>
const stars = document.querySelectorAll('.stars i');
let selectedRating = 0;

stars.forEach((star, index) => {
  star.addEventListener('mouseover', () => {
    stars.forEach((s, i) => s.classList.toggle('hovered', i <= index));
  });
  star.addEventListener('mouseout', () => {
    stars.forEach((s, i) => {
      s.classList.remove('hovered');
      s.classList.toggle('active', i < selectedRating);
    });
  });
  star.addEventListener('click', () => {
    selectedRating = index + 1;
    stars.forEach((s, i) => s.classList.toggle('active', i < selectedRating));
  });
});
</script>

</body>
</html>
